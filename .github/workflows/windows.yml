name: Instalador Windows

# Construye el instalador ComparadorOfertas_Setup.exe (Inno Setup) en una máquina Windows de GitHub.
# No se genera ningún .exe propio: se instala el Python embebido OFICIAL (firmado) + el código de la app, para que
# Smart App Control / Control de aplicaciones de Windows no bloquee la app (ver windows/empaquetar.py).
# Descarga: pestaña Actions -> última ejecución -> Artifacts.
on:
  push:
    branches: ['**']
    paths-ignore: ['obras/**', '**.md']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: automatizador          # el paquete se importa como "automatizador"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'       # misma versión X.Y que el Python embebido de windows/empaquetar.py

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r automatizador/requirements.txt

      - name: Prueba rápida (lee los ejemplos y genera el Excel)
        shell: bash
        env:
          AUTOMATIZADOR_DATOS: ${{ runner.temp }}/datos_prueba
        run: |
          python -m automatizador comparar "automatizador/obras/alburquerque/cliente/DOC20250604121822Pliego de prescripciones tecnicas.PDF.pdf" automatizador/obras/alburquerque/proveedores/electrofil/OFE_160_70922.pdf "automatizador/obras/alburquerque/proveedores/sonepar/SONEPAR  PRTºcentro empleo alburquerque.pdf" --obra prueba -o prueba.xlsx

      - name: Prueba de la app de principio a fin (subir, elegir capítulos, corregir líneas, Excel)
        shell: bash
        run: python -m automatizador.tests.test_flujo

      - name: Paquete (Python embebido oficial + librerías de PyPI + código de la app)
        run: python automatizador/windows/empaquetar.py paquete

      - name: Prueba del paquete (su propio Python, OCR y servidor)
        shell: pwsh
        run: |
          $py = "$pwd\paquete\python\python.exe"
          & $py -c "import automatizador.app_web, rapidocr_onnxruntime, pdfplumber, openpyxl, numpy, pypdfium2; print('importaciones OK')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $pdf = "$pwd\automatizador\obras\mormones\proveedores\sonepar\ilumlamp(SOLO ILUM.LAMP.).pdf"
          & $py -c "import sys; from automatizador.lectores import pdf_oferta; d = pdf_oferta.leer(sys.argv[1]); n = sum(1 for _ in d.partidas()); print('OCR Sonepar:', n, 'lineas'); sys.exit(0 if n > 20 else 1)" $pdf
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:AUTOMATIZADOR_DATOS = "$env:RUNNER_TEMP\datos_paquete"
          $p = Start-Process -FilePath $py -ArgumentList "`"$pwd\paquete\app\automatizador\windows\lanzador.py`"", "--no-abrir" -WorkingDirectory "$pwd\paquete\app" -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/obras
          Write-Host "Servidor:" $r.StatusCode $r.Content
          Stop-Process -Id $p.Id -Force
          if ($r.StatusCode -ne 200) { exit 1 }

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = "1.1.${{ github.run_number }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=$v" "/DOrigen=$pwd\paquete" "/O$pwd\instalador" automatizador\windows\instalador.iss

      - uses: actions/upload-artifact@v4
        with:
          name: ComparadorOfertas_Setup
          path: instalador/*.exe
          retention-days: 30
