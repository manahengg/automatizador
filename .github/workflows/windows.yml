name: Instalador Windows

# Construye el paquete ComparadorOfertas_Windows (ZIP con Instalar.bat) en una máquina Windows de GitHub.
# No se genera ningún .exe propio: se instala el Python embebido OFICIAL (firmado) + el código de la app, para que
# Smart App Control / Control de aplicaciones de Windows no bloquee la app (ver windows/empaquetar.py).
# Descarga: pestaña Actions -> última ejecución -> Artifacts.
on:
  push:
    branches: ['**']
    paths-ignore: ['obras/**', '**.md']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: automatizador          # el paquete se importa como "automatizador"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'       # misma versión X.Y que el Python embebido de windows/empaquetar.py

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r automatizador/requirements.txt
          pip install reportlab          # solo para generar los documentos de prueba inventados (tests/ejemplos.py)

      - name: Prueba rápida (documentos de prueba inventados -> Excel)
        shell: bash
        env:
          AUTOMATIZADOR_DATOS: ${{ runner.temp }}/datos_prueba
        run: |
          python -m automatizador.tests.ejemplos ejemplos_prueba
          python -m automatizador comparar ejemplos_prueba/presupuesto_cliente_prueba.xlsx ejemplos_prueba/oferta_prueba_1.pdf ejemplos_prueba/oferta_prueba_escaneada.pdf --obra prueba -o prueba.xlsx

      - name: Prueba de la app de principio a fin (subir, elegir capítulos, corregir líneas, Excel)
        shell: bash
        run: python -m automatizador.tests.test_flujo

      - name: Paquete (Python embebido oficial + librerías de PyPI + código de la app)
        run: python automatizador/windows/empaquetar.py paquete

      - name: Prueba del paquete (su propio Python, OCR y servidor)
        shell: pwsh
        run: |
          $py = "$pwd\paquete\python\python.exe"
          & $py -c "import automatizador.app_web, rapidocr_onnxruntime, pdfplumber, openpyxl, numpy, pypdfium2, onnxruntime_genai; print('importaciones OK (también el motor de lenguaje)')"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $py -c "from automatizador import actualizar as A; v = A.version_actual(); print('Versión:', v); assert A.instalado() and v['sha'] and v['rama']"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $pdf = "$pwd\ejemplos_prueba\oferta_prueba_escaneada.pdf"
          & $py -c "import sys; from automatizador.lectores import pdf_oferta; d = pdf_oferta.leer(sys.argv[1]); n = sum(1 for _ in d.partidas()); print('OCR oferta escaneada de prueba:', n, 'lineas'); sys.exit(0 if n >= 4 else 1)" $pdf
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:AUTOMATIZADOR_DATOS = "$env:RUNNER_TEMP\datos_paquete"
          $p = Start-Process -FilePath $py -ArgumentList "`"$pwd\paquete\app\automatizador\windows\lanzador.py`"", "--no-abrir" -WorkingDirectory "$pwd\paquete\app" -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/obras
          Write-Host "Servidor:" $r.StatusCode $r.Content
          Stop-Process -Id $p.Id -Force
          if ($r.StatusCode -ne 200) { exit 1 }

      - name: Prueba de Instalar.bat (copia, accesos directos y servidor desde la carpeta instalada)
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\instalado"
          & "$pwd\paquete\python\python.exe" "$pwd\paquete\app\automatizador\windows\instalar.py" --destino $dest --no-abrir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Comparador de ofertas.lnk'
          if (-not (Test-Path $lnk)) { Write-Host "Falta el acceso directo"; exit 1 }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "Acceso directo ->" $s.TargetPath $s.Arguments
          $env:AUTOMATIZADOR_DATOS = "$env:RUNNER_TEMP\datos_instalado"
          $p = Start-Process -FilePath $s.TargetPath -ArgumentList $s.Arguments, "--no-abrir" -WorkingDirectory $s.WorkingDirectory -PassThru
          Start-Sleep -Seconds 12
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/obras
          Stop-Process -Id $p.Id -Force
          if ($r.StatusCode -ne 200) { exit 1 }
          Write-Host "Instalado y abierto OK"

      - name: Informe de firmas (qué binarios no están firmados)
        continue-on-error: true
        shell: pwsh
        run: |
          $b = Get-ChildItem paquete -Recurse -Include *.exe,*.dll,*.pyd
          $sin = $b | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          Write-Host ("Binarios: {0}; firmados: {1}; sin firma: {2}" -f $b.Count, ($b.Count - $sin.Count), $sin.Count)
          $sin | Group-Object { ($_.FullName -replace '.*\\site-packages\\', '' -replace '.*\\paquete\\', '').Split('\')[0] } |
            Sort-Object Count -Descending | ForEach-Object { Write-Host ("  {0,-28} {1}" -f $_.Name, $_.Count) }

      # Sin instalador .exe: Inno Setup no está firmado y Smart App Control lo bloquea (error 4551). Se publica la
      # carpeta (GitHub la entrega como ZIP) con Instalar.bat. windows/instalador.iss queda para cuando haya firma.
      - uses: actions/upload-artifact@v4
        with:
          name: ComparadorOfertas_Windows
          path: paquete/
          retention-days: 30
